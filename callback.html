<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autorisation TikTok</title>
<style>
:root{--bg:#faf8f5;--fg:#1c1a17;--dim:#6b645c;--line:#e2ddd5;--accent:#c2410c;--ok:#15803d;--err:#b91c1c;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--fg:#f0ece5;--dim:#a39b90;--line:#332e26;--accent:#fb923c;--ok:#4ade80;--err:#f87171;--card:#211d16}}
:root[data-theme="dark"]{--bg:#17150f;--fg:#f0ece5;--dim:#a39b90;--line:#332e26;--accent:#fb923c;--ok:#4ade80;--err:#f87171;--card:#211d16}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:48px 16px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 6px}
.sub{color:var(--dim);margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:8px}
code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.95rem;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:.92rem;cursor:pointer}
button:hover{opacity:.9}
.ok{color:var(--ok)}.err{color:var(--err)}
ol{padding-left:20px;color:var(--dim);font-size:.92rem}
</style>
</head>
<body>
<div class="wrap">
<h1 id="title">Autorisation reçue</h1>
<p class="sub" id="sub">Copiez le code ci-dessous dans le calendrier.</p>
<div id="out"></div>
</div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var code = p.get('code');
  var err = p.get('error_description') || p.get('error');
  var out = document.getElementById('out');

  if (err) {
    document.getElementById('title').textContent = 'Autorisation refusée';
    document.getElementById('sub').textContent = 'TikTok a renvoyé une erreur.';
    out.innerHTML = '<div class="card"><div class="label err">Erreur</div><code></code></div>';
    out.querySelector('code').textContent = err;
    return;
  }

  if (!code) {
    document.getElementById('title').textContent = 'Rien à afficher';
    document.getElementById('sub').textContent =
      "Cette page s'affiche après une autorisation TikTok. Aucun code n'est présent dans l'adresse.";
    return;
  }

  out.innerHTML =
    '<div class="card"><div class="label">Code d’autorisation</div>' +
    '<code id="c"></code><button id="b">Copier le code</button> ' +
    '<span id="s" class="ok"></span></div>' +
    '<ol><li>Copiez ce code.</li>' +
    '<li>Ouvrez le calendrier : Réglages → Synchro auto → Connexion TikTok.</li>' +
    '<li>Collez-le puis cliquez sur « Connecter ».</li>' +
    '<li>Le code expire vite : utilisez-le tout de suite.</li></ol>';

  document.getElementById('c').textContent = code;
  document.getElementById('b').addEventListener('click', function () {
    navigator.clipboard.writeText(code).then(function () {
      document.getElementById('s').textContent = 'copié';
    }, function () {
      document.getElementById('s').textContent = 'copie impossible, sélectionnez à la main';
    });
  });
})();
</script>
</body>
</html>
